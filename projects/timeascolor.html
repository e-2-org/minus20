	<script type="text/javascript" language="javascript">
	<!--
	function changecolor(){
		// set variables for times that need to be changed
		var s;
		var m;
    var colcol;
    var agt=navigator.userAgent.toLowerCase();
    var major=parseInt(navigator.appVersion);
    var isie=((agt.indexOf("msie")!=-1)&&(agt.indexOf("opera")==-1));
    var isns6=((agt.indexOf('mozilla')!=-1)&&(agt.indexOf('spoofer')==-1)&&(agt.indexOf('compatible')==-1)&&(agt.indexOf('opera')==-1)&&(agt.indexOf('webtv')==-1)&&(agt.indexOf('hotjava')==-1))&&(major>=5);
    if(isie) colcol=eval("document.all.colcol");
    if(isns6) colcol=document.getElementById("colcol");
		t = new Date();
		// add 0 to the seconds string if under 10
		(t.getSeconds() < 10) ? s = "0" + t.getSeconds() : s = t.getSeconds();
		// add 0 to the minutes string if  under 10
		(t.getMinutes() < 10) ? m = "0" + t.getMinutes() : m = t.getMinutes();
		//set the color of the colcol div to the hex color of the time
		colcol.style.backgroundColor= t.getHours().toString() + m + s;
		//display the time in form fields
		document.forms[0].h.value = t.getHours().toString();
		document.forms[0].m.value = m;
		document.forms[0].s.value = s;
		}	
	// invokes the changecolor function every second
	function init(){
		setInterval("changecolor()",100);
		}
	//-->
	</script>	
</head>
<body onload="init();" leftmargin="150" bgcolor="#ffffff">
<!--colorfield-->
<div style="background-color:#ffffff;width:400px;height:400px" id="colcol"></div>
<!--/colorfield-->
<form action="#" method="get">
	&nbsp;<input type="text" name="h" size="2"> = <b>hours</b> = red &nbsp;&nbsp;&nbsp;<input type="text" name="m" size="2"> = <b>minutes</b> = green &nbsp;&nbsp;&nbsp;<input type="text" name="s" size="2"> = <b>seconds</b> = blue<br>
</form>
